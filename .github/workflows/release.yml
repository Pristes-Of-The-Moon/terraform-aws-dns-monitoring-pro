name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to (re)publish"
        required: true

# Read-only by default at workflow level
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    # Only this job needs these writes
    permissions:
      contents: write
      id-token: write # for keyless signing

    outputs:
      base64_subjects: ${{ steps.subjects.outputs.base64_subjects }}
      tag_name: ${{ steps.meta.outputs.tag_name }}

    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TAG_NAME }}

      - name: Set build metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "templates-${TAG_NAME}.tar.gz" templates docs README.md LICENSE SECURITY.md
          sha256sum "templates-${TAG_NAME}.tar.gz" > "templates-${TAG_NAME}.tar.gz.sha256"

      - name: Compute provenance subjects (base64)
        id: subjects
        shell: bash
        run: |
          set -euo pipefail
          echo "base64_subjects=$(sha256sum templates-${TAG_NAME}.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Install cosign (pinned by checksum)
        shell: bash
        run: |
          set -euo pipefail
          COSIGN_VERSION="v2.2.3"
          COSIGN_SHA256="f669f41176cb1d58bb6a3fdb06e24861540cfdb5a571b4ec5eb2218b0df5d304"

          curl -sSLo cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          install -m 0755 cosign /usr/local/bin/cosign

      # Produce Sigstore bundle files (both .sigstore and .sigstore.json for broad tooling compatibility)
      - name: Sign artifact (keyless) -> Sigstore bundle
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --bundle "templates-${TAG_NAME}.tar.gz.sigstore" \
            "templates-${TAG_NAME}.tar.gz"
          cp "templates-${TAG_NAME}.tar.gz.sigstore" "templates-${TAG_NAME}.tar.gz.sigstore.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            templates-${{ env.TAG_NAME }}.tar.gz
            templates-${{ env.TAG_NAME }}.tar.gz.sha256
            templates-${{ env.TAG_NAME }}.tar.gz.sigstore
            templates-${{ env.TAG_NAME }}.tar.gz.sigstore.json

  provenance:
    needs: [release]
    permissions:
      actions: read
      contents: write # needed to upload provenance to the GitHub Release
      id-token: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a
    with:
      base64-subjects: ${{ needs.release.outputs.base64_subjects }}
      upload-assets: true
      upload-tag-name: ${{ needs.release.outputs.tag_name }}
